name: CI

# 注意：schedule 必须放在 on: 映射内部；写成顶层键会让 workflow 解析失败（422），
# 后果是**任何**事件都不触发（本仓库踩过：push 一直无 run，dispatch 报 500/422）
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC 兜底跑一次

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: 系统运行库（pybullet / opencv 依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      # 依赖只从 pyproject.toml 读一次 → 不在 CI 里手抄版本，避免与本地漂移
      - name: 安装依赖
        run: |
          python -c "import pathlib, tomllib; print(chr(10).join(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']))" > /tmp/reqs.txt
          python -m pip install --upgrade pip
          # 先装 CPU 版 torch（Linux 上 PyPI 默认 wheel 会拖 ~2.5GB CUDA 库，CI 只需要 CPU）
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/reqs.txt pytest

      # 全部测试跑 DIRECT（headless），不需要显示器/GUI
      - name: 回归测试
        run: python -m pytest -v
