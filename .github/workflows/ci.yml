name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: 系统运行库（pybullet / opencv 依赖）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      # 依赖只从 pyproject.toml 读一次 → 不在 CI 里手抄版本，避免与本地漂移
      - name: 安装依赖
        run: |
          python - <<'PY' > /tmp/reqs.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print("\n".join(data["project"]["dependencies"]))
          PY
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/reqs.txt pytest

      # 全部测试跑 DIRECT（headless），不需要显示器/GUI
      - name: 回归测试
        run: python -m pytest -v
